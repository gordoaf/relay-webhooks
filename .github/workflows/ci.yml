name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t relay:test .
      - name: Container smoke test
        shell: bash
        run: |
          docker run -d --name relay-smoke -p 127.0.0.1:8787:8787 -e RELAY_ADMIN_TOKEN=test-container-token-with-32-characters relay:test
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8787/healthz; then exit 0; fi
            sleep 1
          done
          docker logs relay-smoke
          exit 1
