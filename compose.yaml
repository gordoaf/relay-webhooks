services:
  relay:
    build: .
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:?Set RELAY_ADMIN_TOKEN in .env}
      RELAY_DB_PATH: /data/relay.db
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-}
    volumes:
      - relay-data:/data
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  relay-data:
