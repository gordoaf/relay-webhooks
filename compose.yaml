services:
  relay:
    build: .
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:?Set RELAY_ADMIN_TOKEN in .env}
      RELAY_DB_PATH: /data/relay.db
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-}
      RELAY_WORKER_ENABLED: ${RELAY_WORKER_ENABLED:-true}
      RELAY_WORKER_CONCURRENCY: ${RELAY_WORKER_CONCURRENCY:-4}
      RELAY_METRICS_TOKEN: ${RELAY_METRICS_TOKEN:-}
      RELAY_RETENTION_DAYS: ${RELAY_RETENTION_DAYS:-0}
      RELAY_IDEMPOTENCY_DAYS: ${RELAY_IDEMPOTENCY_DAYS:-90}
      RELAY_CLEANUP_BATCH_SIZE: ${RELAY_CLEANUP_BATCH_SIZE:-100}
      RELAY_MIN_FREE_BYTES: ${RELAY_MIN_FREE_BYTES:-0}
      RELAY_MAX_STORAGE_BYTES: ${RELAY_MAX_STORAGE_BYTES:-0}
      RELAY_STORAGE_WARNING_PERCENT: ${RELAY_STORAGE_WARNING_PERCENT:-90}
      RELAY_QUEUE_WARNING_AGE_SECONDS: ${RELAY_QUEUE_WARNING_AGE_SECONDS:-300}
      RELAY_FAILURE_WARNING_PERCENT: ${RELAY_FAILURE_WARNING_PERCENT:-25}
      RELAY_FAILURE_MIN_SAMPLES: ${RELAY_FAILURE_MIN_SAMPLES:-10}
      RELAY_ALERT_WEBHOOK_URL: ${RELAY_ALERT_WEBHOOK_URL:-}
      RELAY_ALERT_SIGNING_SECRET: ${RELAY_ALERT_SIGNING_SECRET:-}
      RELAY_ALERT_COOLDOWN_SECONDS: ${RELAY_ALERT_COOLDOWN_SECONDS:-3600}
      RELAY_MAINTENANCE_INTERVAL_SECONDS: ${RELAY_MAINTENANCE_INTERVAL_SECONDS:-30}
      RELAY_MAINTENANCE_ENABLED: ${RELAY_MAINTENANCE_ENABLED:-true}
    volumes:
      - relay-data:/data
    restart: unless-stopped
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  relay-data:
